<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}SmartPark{% endblock %} — Smart Parking Slot Allocator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230e1420'/><text y='24' x='4' font-size='22' font-family='Arial' font-weight='900' fill='%2338bdf8'>P</text></svg>"/>
</head>
<body>

<nav class="navbar">
  <!-- Logo matching provided brand image -->
  <a class="navbar-brand" href="/">
    <!-- P-pin SVG logo -->
    <svg width="34" height="38" viewBox="0 0 34 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e3a5f"/>
          <stop offset="100%" stop-color="#0e1420"/>
        </linearGradient>
      </defs>
      <!-- Pin shape -->
      <path d="M17 0C9.27 0 3 6.27 3 14c0 9.5 14 24 14 24S31 23.5 31 14C31 6.27 24.73 0 17 0z"
            fill="url(#logoGrad)" stroke="#38bdf8" stroke-width="1.2"/>
      <!-- P letterform -->
      <text x="10" y="20" font-family="Arial" font-weight="900" font-size="14"
            fill="#38bdf8" letter-spacing="-0.5">P</text>
      <!-- Green highlight dot at pin bottom -->
      <circle cx="17" cy="35" r="1.8" fill="#22c55e" opacity="0.9"/>
    </svg>
    <div class="brand-wordmark">
      <span class="brand-name">SmartPark</span>
      <span class="brand-tagline">Slot Allocator</span>
    </div>
  </a>

  <ul class="navbar-nav">
    <li>
      <a href="/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
    </li>
    <li>
      <a href="/parking">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13" rx="2"/>
          <path d="M16 8h4l3 3v5h-7V8z"/>
          <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
        Parking Lot
      </a>
    </li>
    <li>
      <a href="/history">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3h18v4H3z"/><path d="M3 9h18v4H3z"/><path d="M3 15h18v4H3z"/>
        </svg>
        History
      </a>
    </li>
  </ul>

  <div class="navbar-system-status">
    <div class="status-dot"></div>
    System Online
  </div>
</nav>

{% block content %}{% endblock %}

<div id="toast-container"></div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
